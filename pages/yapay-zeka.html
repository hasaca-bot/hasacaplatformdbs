<script>
/* Applied synchronously before <body> parses, same as landing.html — shares its
   localStorage['landing_theme'] key so a choice made on either page carries over to the other. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('landing_theme'); } catch(e){}
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'mono' : 'dark');
  if (theme === 'mono') document.documentElement.classList.add('theme-mono');
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
@font-face{
  font-family:'Samsung Sharp Sans';
  src:url('/fonts/SamsungSharpSans-Bold.ttf') format('truetype');
  font-weight:1 1000; font-style:normal; font-display:swap;
}
:root{
  --font-primary:'Samsung Sharp Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg:#0a0a0b; --bg-2:#0e0e11; --bg-3:#141418;
  --surface:rgba(255,255,255,.03); --surface-2:rgba(255,255,255,.055);
  --glass:rgba(20,20,24,.55);
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14);
  --text:#f4f4f6; --text-dim:#a6a6b0; --text-mute:#6c6c78; --white:#fff;
  --gold:#d8b877; --gold-rgb:216,184,119; --gold-soft:rgba(var(--gold-rgb),.14);
  --shine:linear-gradient(135deg,#ffffff 0%,#c9c9d2 45%,#8f8f9c 100%);
  --ok:#7fd18f; --warn:#e0c070;
  --radius:22px; --radius-lg:30px; --radius-sm:14px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow:0 30px 80px -30px rgba(0,0,0,.85);
  --maxw:1180px;
}
/* Black & White theme, ported from landing.html (same localStorage['landing_theme'] key, so a
   choice made on either page carries over to the other) — a real white background/dark text, not
   a filter. Overrides every design token these 45 pages build on, plus the handful of components
   that use a hardcoded hex instead of a token (buttons, nav brand mark, scrolled-nav backdrop). */
html.theme-mono{
  --bg:#ffffff; --bg-2:#f5f5f7; --bg-3:#ececef;
  --surface:rgba(10,10,11,.035); --surface-2:rgba(10,10,11,.06);
  --glass:rgba(255,255,255,.75);
  --border:rgba(10,10,11,.1); --border-2:rgba(10,10,11,.16);
  --text:#0a0a0b; --text-dim:#4a4a52; --text-mute:#78787f; --white:#0a0a0b;
  --gold:#0a0a0b; --gold-rgb:10,10,11; --gold-soft:rgba(10,10,11,.08);
  --shine:linear-gradient(135deg,#0a0a0b 0%,#3c3c42 45%,#6e6e78 100%);
  --shadow:0 30px 80px -30px rgba(10,10,11,.18);
  --ok:#1f7a3d; --warn:#8a6d1f;
}
html.theme-mono body{ background:var(--bg); }
html.theme-mono .nav{ background:rgba(255,255,255,.72); }
html.theme-mono .nav.scrolled{ background:rgba(255,255,255,.88); }
html.theme-mono .nav.open .nav-links{ background:rgba(255,255,255,.97); }
html.theme-mono .brand .mark,
html.theme-mono .theme-switch.on{ color:var(--gold); }
html.theme-mono .brand .mark{
  background:#f0f0f2; border-color:rgba(10,10,11,.15); box-shadow:inset 0 1px 0 rgba(255,255,255,.8); color:#0a0a0b;
}
html.theme-mono .btn-primary{ background:#0a0a0b; color:#fff; box-shadow:0 10px 30px -8px rgba(10,10,11,.35); }
html.theme-mono .nav-toggle{ color:#0a0a0b; }
html.theme-mono ::selection{ background:var(--gold-soft); color:#0a0a0b; }
html.theme-mono .foot-social a:hover{ color:#0a0a0b; }
/* Comparison table checkmark (table.cmp .yes) — same near-white-on-white bug landing.html had. */
html.theme-mono .yes{ color:#0a0a0b; }
html.theme-mono .step .num{ background:linear-gradient(150deg,#f0f0f2,#e2e2e6); }
html.theme-mono .step .num .shine{
  background:linear-gradient(135deg,#0a0a0b 0%,#3c3c42 45%,#6e6e78 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
/* Contact-form status messages — the dark-theme colors are pale mint/salmon text tuned for a near-
   black background; unreadable on white, no landing.html equivalent to copy since it has no
   contact form. New, distinct dark tones for legibility on the light background. */
html.theme-mono .form-msg.ok{ background:rgba(31,122,61,.08); border:1px solid rgba(31,122,61,.3); color:#1f7a3d; }
html.theme-mono .form-msg.bad{ background:rgba(168,50,38,.08); border:1px solid rgba(168,50,38,.3); color:#a83226; }
*{ font-family:var(--font-primary) !important; }
code,pre,kbd,samp,.mono{ font-family:ui-monospace,'SFMono-Regular',Menlo,monospace !important; }
html{ scroll-behavior:smooth; }
body{ background:var(--bg); color:var(--text); line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative; }
body::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 40% at 78% 4%, rgba(216,184,119,.08), transparent 60%),
    radial-gradient(50% 45% at 6% 14%, rgba(120,130,180,.07), transparent 60%); }
a{ color:inherit; text-decoration:none; }
img{ max-width:100%; display:block; }
::selection{ background:var(--gold-soft); color:#fff; }
::-webkit-scrollbar{ width:11px; height:11px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.12); border-radius:8px; border:3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.22); }
*{ scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; position:relative; z-index:1; }
section{ position:relative; z-index:1; }
.shine{ background:var(--shine); -webkit-background-clip:text; background-clip:text; color:transparent; }
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-dim); padding:7px 14px; border-radius:999px;
  background:var(--surface); border:1px solid var(--border); }
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
h1,h2,h3{ line-height:1.1; letter-spacing:-.02em; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:9px; font-size:15px;
  padding:13px 24px; border-radius:999px; cursor:pointer; border:1px solid transparent;
  transition:transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease); white-space:nowrap; }
.btn svg{ width:17px; height:17px; }
.btn-primary{ background:#fff; color:#0a0a0b; box-shadow:0 10px 30px -8px rgba(255,255,255,.35); }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:0 16px 42px -8px rgba(255,255,255,.5); }
.btn-ghost{ background:var(--surface-2); color:var(--text); border-color:var(--border-2); }
.btn-ghost:hover{ background:rgba(255,255,255,.11); transform:translateY(-2px); }
.btn-lg{ padding:16px 30px; font-size:16px; }
.btn-whatsapp{ background:#25D366; color:#06210f; width:100%; margin-top:14px; }
.btn-whatsapp:hover{ transform:translateY(-2px); box-shadow:0 16px 42px -8px rgba(37,211,102,.5); }

/* NAV */
.nav{ position:sticky; top:0; z-index:100; backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3); background:rgba(10,10,11,.72);
  border-bottom:1px solid transparent; transition:border-color .3s, background .3s; }
.nav.scrolled{ border-bottom-color:var(--border); background:rgba(10,10,11,.88); }
.nav-in{ max-width:var(--maxw); margin:0 auto; padding:15px 24px; display:flex; align-items:center; gap:22px; }
.brand{ display:flex; align-items:center; gap:11px; font-size:20px; }
.brand .mark{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
  background:linear-gradient(150deg,#2a2a30,#0c0c0e); border:1px solid var(--border-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14); }
.brand .mark span{ font-size:16px; background:var(--shine); -webkit-background-clip:text; background-clip:text; color:transparent; }
.nav-links{ display:flex; gap:4px; margin-left:10px; }
.nav-links a{ color:var(--text-dim); font-size:14.5px; padding:8px 13px; border-radius:10px; transition:color .15s, background .15s; }
.nav-links a:hover,.nav-links a.on{ color:var(--text); background:var(--surface); }
.nav-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.nav-cta-mobile{ display:none; color:var(--gold) !important; }
.theme-switch{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; flex:none;
  background:var(--surface); border:1px solid var(--border); border-radius:999px; color:var(--text-mute);
  cursor:pointer; transition:all .15s; }
.theme-switch:hover{ color:var(--text); border-color:var(--border-2); }
.theme-switch.on{ background:var(--surface-2); color:var(--gold); }
.lang{ display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
.lang button{ background:none; border:none; color:var(--text-mute); font-size:12.5px; cursor:pointer; padding:5px 11px; border-radius:999px; transition:all .15s; }
.lang button.on{ background:var(--surface-2); color:var(--text); }
.nav-toggle{ display:none; background:var(--surface); border:1px solid var(--border); color:#fff; width:42px; height:42px; border-radius:12px; cursor:pointer; }
.nav-toggle svg{ width:20px; height:20px; margin:auto; }

/* BREADCRUMB */
.crumb{ padding:20px 0 0; font-size:13px; color:var(--text-mute); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.crumb a:hover{ color:var(--text); }

/* HERO */
.p-hero{ padding:46px 0 54px; max-width:760px; }
.p-hero h1{ font-size:clamp(32px,5.2vw,60px); margin:20px 0 20px; }
.p-hero p{ font-size:clamp(16px,1.8vw,19px); color:var(--text-dim); margin-bottom:28px; }
.p-hero .acts{ display:flex; gap:12px; flex-wrap:wrap; }

.block{ padding:44px 0; }
.b-head{ max-width:680px; margin-bottom:34px; }
.b-head h2{ font-size:clamp(24px,3.4vw,38px); margin-bottom:12px; }
.b-head p{ color:var(--text-dim); font-size:16px; }

/* CARDS */
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px;
  transition:transform .18s var(--ease), border-color .18s, background .18s; display:block; }
.card:hover{ transform:translateY(-4px); border-color:var(--border-2); background:var(--surface-2); }
.card h4{ font-size:16.5px; margin-bottom:8px; }
.card p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }
.card .more{ font-size:12.5px; color:var(--gold); margin-top:12px; display:inline-flex; align-items:center; gap:6px; }
.card .ci{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; margin-bottom:14px;
  background:linear-gradient(150deg,#232329,#0e0e11); border:1px solid var(--border-2); color:var(--gold); font-size:15px; }

/* PROSE */
.prose{ max-width:820px; }
.prose .sec{ padding:22px 0; border-top:1px solid var(--border); }
.prose .sec:first-child{ border-top:none; padding-top:0; }
.prose h3{ font-size:19px; margin-bottom:10px; }
.prose p{ color:var(--text-dim); font-size:15px; line-height:1.75; }

/* STEPS */
.steps{ max-width:760px; position:relative; }
.steps::before{ content:''; position:absolute; left:25px; top:14px; bottom:14px; width:2px; background:linear-gradient(var(--gold),transparent); opacity:.35; }
.step{ display:flex; gap:20px; padding:14px 0; align-items:flex-start; }
.step .num{ flex:none; width:52px; height:52px; border-radius:15px; display:grid; place-items:center; font-size:18px;
  background:linear-gradient(150deg,#202026,#0c0c0e); border:1px solid var(--border-2); position:relative; z-index:1; }
.step h4{ font-size:17.5px; margin:8px 0 5px; }
.step p{ font-size:14px; color:var(--text-dim); }

/* FAQ */
.faq{ max-width:820px; }
.qa{ border:1px solid var(--border); border-radius:var(--radius); margin-bottom:11px; background:var(--surface); overflow:hidden; }
.qa summary{ list-style:none; cursor:pointer; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; font-size:15.5px; }
.qa summary::-webkit-details-marker{ display:none; }
.qa summary .pl{ flex:none; width:24px; height:24px; border-radius:8px; border:1px solid var(--border-2); display:grid; place-items:center; transition:transform .2s; color:var(--text-dim); }
.qa[open] summary .pl{ transform:rotate(45deg); color:var(--gold); }
.qa .ans{ padding:0 20px 18px; color:var(--text-dim); font-size:14.5px; line-height:1.65; }
.qa .ans a{ color:var(--gold); }

/* STATS */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.statc{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 20px; }
.statc .n{ font-size:clamp(24px,3vw,34px); background:var(--shine); -webkit-background-clip:text; background-clip:text; color:transparent; }
.statc .lb{ font-size:13px; color:var(--text-dim); margin-top:6px; }

/* TABLE */
.tbl-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
table.cmp{ width:100%; border-collapse:collapse; min-width:560px; }
table.cmp th,table.cmp td{ padding:14px 18px; text-align:left; font-size:14px; border-top:1px solid var(--border); }
table.cmp thead th{ border-top:none; background:var(--bg-3); font-size:14.5px; }
table.cmp thead th:not(:first-child),table.cmp td:not(:first-child){ text-align:center; }
table.cmp td:first-child{ color:var(--text-dim); }
table.cmp tbody tr:hover{ background:rgba(255,255,255,.02); }
.yes{ color:#e9e9ee; } .no{ color:var(--text-mute); }
.cmp svg{ width:18px; height:18px; }

/* PLANS */
.price-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:stretch; }
.plan{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px 24px; display:flex; flex-direction:column; transition:transform .18s var(--ease), border-color .18s; }
.plan:hover{ transform:translateY(-5px); border-color:var(--border-2); }
.plan.pop{ background:linear-gradient(180deg,rgba(var(--gold-rgb),.08),var(--surface)); border-color:rgba(var(--gold-rgb),.4); }
.plan .badge{ align-self:flex-start; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); background:var(--gold-soft); border:1px solid rgba(var(--gold-rgb),.3); padding:5px 11px; border-radius:999px; margin-bottom:13px; }
.plan h4{ font-size:18px; margin-bottom:5px; }
.plan .desc{ font-size:13px; color:var(--text-mute); margin-bottom:16px; min-height:34px; }
.plan .amt{ display:flex; align-items:baseline; gap:6px; margin-bottom:18px; }
.plan .amt .v{ font-size:40px; letter-spacing:-.03em; }
.plan .amt .per{ font-size:13px; color:var(--text-mute); }
.plan ul{ list-style:none; display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
.plan li{ display:flex; gap:9px; font-size:13.5px; color:var(--text-dim); align-items:flex-start; }
.plan li svg{ width:15px; height:15px; color:var(--gold); flex:none; margin-top:3px; }
.plan .btn{ margin-top:auto; width:100%; }

/* POSTS */
.posts{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.post{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; transition:transform .18s var(--ease), border-color .18s; }
.post:hover{ transform:translateY(-4px); border-color:var(--border-2); }
.post .meta{ font-size:12px; color:var(--gold); margin-bottom:9px; letter-spacing:.04em; }
.post h4{ font-size:17px; margin-bottom:9px; line-height:1.35; }
.post p{ font-size:13.5px; color:var(--text-dim); line-height:1.55; }

/* TIMELINE */
.tl{ max-width:820px; position:relative; }
.tl::before{ content:''; position:absolute; left:9px; top:10px; bottom:10px; width:2px; background:var(--border-2); }
.tl-item{ display:flex; gap:20px; padding:13px 0; }
.tl-dot{ flex:none; width:20px; height:20px; border-radius:50%; margin-top:4px; position:relative; z-index:1;
  background:var(--bg-3); border:2px solid var(--border-2); }
.tl-item.done .tl-dot{ background:var(--gold); border-color:var(--gold); }
.tl-item.active .tl-dot{ border-color:var(--gold); box-shadow:0 0 0 4px var(--gold-soft); }
.tl-when{ font-size:11.5px; color:var(--gold); letter-spacing:.08em; text-transform:uppercase; }
.tl-item h4{ font-size:17px; margin:5px 0 5px; }
.tl-item p{ font-size:14px; color:var(--text-dim); }

/* STATUS */
.st-list{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); }
.st-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-top:1px solid var(--border); font-size:14.5px; }
.st-row:first-child{ border-top:none; }
.st-badge{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ok); }
.st-badge .d{ width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 10px var(--ok); }

/* CODE */
.code-list{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--bg-2); }
.code-row{ display:flex; gap:18px; align-items:center; padding:14px 18px; border-top:1px solid var(--border); flex-wrap:wrap; }
.code-row:first-child{ border-top:none; }
.code-row code{ font-size:13px; color:var(--gold); background:var(--surface-2); padding:5px 10px; border-radius:8px; white-space:nowrap; }
.code-row span{ font-size:13.5px; color:var(--text-dim); }

/* FORM */
.form-wrap{ display:grid; grid-template-columns:1fr 1.05fr; gap:44px; align-items:start; }
.form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; box-shadow:var(--shadow); }
.form .row{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
.field input,.field textarea{ width:100%; background:var(--bg-2); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; color:var(--text); font-size:14.5px; transition:border-color .15s, box-shadow .15s; resize:vertical; }
.field input:focus,.field textarea:focus{ outline:none; border-color:rgba(var(--gold-rgb),.55); box-shadow:0 0 0 3px var(--gold-soft); }
.field.err input,.field.err textarea{ border-color:#c0463a; box-shadow:0 0 0 3px rgba(192,70,58,.18); }
.form .btn{ width:100%; margin-top:4px; }
.form-note{ font-size:12px; color:var(--text-mute); text-align:center; margin-top:12px; }
.form-msg{ text-align:center; padding:12px; border-radius:12px; font-size:14px; margin-bottom:15px; display:none; }
.form-msg.ok{ display:block; background:rgba(120,200,120,.1); border:1px solid rgba(120,200,120,.3); color:#a6e0a6; }
.form-msg.bad{ display:block; background:rgba(200,90,80,.1); border:1px solid rgba(200,90,80,.3); color:#e5a49c; }

/* CTA */
.cta-box{ background:linear-gradient(160deg,rgba(var(--gold-rgb),.09),var(--surface)); border:1px solid var(--border-2);
  border-radius:var(--radius-lg); padding:44px 36px; text-align:center; }
.cta-box h2{ font-size:clamp(24px,3.2vw,36px); margin-bottom:12px; }
.cta-box p{ color:var(--text-dim); font-size:16px; margin-bottom:24px; max-width:560px; margin-left:auto; margin-right:auto; }
.cta-box .acts{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

/* FOOTER */
.footer{ border-top:1px solid var(--border); padding:60px 0 30px; margin-top:50px; }
/* auto-fit so any number of footer groups wraps cleanly; brand keeps its own row */
.foot-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:30px 22px; margin-bottom:40px; }
.foot-brand{ grid-column:1/-1; }
.foot-brand p{ color:var(--text-mute); font-size:13.5px; margin:15px 0 18px; max-width:420px; }
.foot-social{ display:flex; gap:10px; }
.foot-social a{ width:38px; height:38px; border-radius:11px; border:1px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--text-dim); transition:all .15s; }
.foot-social a:hover{ color:#fff; border-color:var(--border-2); background:var(--surface-2); transform:translateY(-2px); }
.foot-social svg{ width:17px; height:17px; }
.foot-col h5{ font-size:13px; color:var(--text); margin-bottom:13px; }
.foot-col a{ display:block; color:var(--text-mute); font-size:13.5px; padding:4px 0; transition:color .15s; }
.foot-col a:hover{ color:var(--text); }
.foot-bottom{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:24px; border-top:1px solid var(--border); flex-wrap:wrap; }
.foot-bottom p{ font-size:13px; color:var(--text-mute); }

.js-anim .rv{ opacity:0; transform:translateY(22px); transition:opacity .6s var(--ease), transform .6s var(--ease); }
.js-anim .rv.in{ opacity:1; transform:none; }

@media (max-width:960px){
  .grid3{ grid-template-columns:repeat(2,1fr); }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .price-grid{ grid-template-columns:1fr; max-width:430px; }
  .plan.pop{ order:-1; }
  .form-wrap{ grid-template-columns:1fr; gap:26px; }
  .posts{ grid-template-columns:1fr; }
  .foot-grid{ grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:24px 18px; }
}
@media (max-width:1080px){
  .nav-links{ display:none; }
  .nav-toggle{ display:grid; }
  .nav.open .nav-links{ display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0;
    background:rgba(10,10,11,.97); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:12px; gap:2px; }
  .nav.open .nav-links a{ padding:12px 14px; }
}
@media (max-width:620px){
  /* both nav buttons move into the collapsed menu so the bar never overflows */
  .nav-right > .btn{ display:none; }
  .nav-cta-mobile{ display:block; }
  .brand{ font-size:17px; } .brand .mark{ width:30px; height:30px; }
  .lang button{ padding:5px 9px; font-size:11.5px; }
  .nav-in{ gap:10px; padding:12px 18px; }
}
@media (max-width:560px){
  .wrap{ padding:0 18px; }
  .grid3{ grid-template-columns:1fr; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .form .row{ grid-template-columns:1fr; }
  .cta-box{ padding:32px 22px; }
  .foot-grid{ grid-template-columns:1fr; }
  .foot-bottom{ justify-content:center; text-align:center; }
  .p-hero .acts .btn{ flex:1; }
}
@media (prefers-reduced-motion:reduce){
  .js-anim .rv{ transition:none; opacity:1; transform:none; }
  html{ scroll-behavior:auto; }
}
</style>

<script src="/marketing-data.js"></script>
<script>
/* ─── state ─── */
let LANG = 'tr';
const SLUG = (location.pathname.replace(/^\/+|\/+$/g,'') || 'ozellikler');
const P = MARKETING.pages[SLUG];
const t = v => Array.isArray(v) ? (v[LANG === 'en' ? 1 : 0] || v[0]) : (v || '');
const esc = s => String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const UI = {
  home:['Ana Sayfa','Home'], rights:['Tüm hakları saklıdır.','All rights reserved.'],
  login:['Yönetici Girişi','Admin Login'], demo:['Ücretsiz Demo','Free Demo'],
  name:['Ad Soyad *','Full Name *'], rest:['Restoran','Restaurant'], email:['E-posta *','Email *'],
  phone:['Telefon','Phone'], country:['Ülke','Country'], msg:['Mesaj *','Message *'],
  namePh:['Adınız','Your name'], restPh:['Restoran adı','Restaurant name'], countryPh:['Türkiye','Turkey'],
  msgPh:['Kısaca ihtiyacınızı yazın...','Briefly describe what you need...'],
  send:['Gönder','Send'], sending:['Gönderiliyor...','Sending...'],
  ok:['Teşekkürler! Talebiniz alındı. Ekibimiz en kısa sürede sizinle iletişime geçecek.','Thank you! Your request was received. Our team will contact you shortly.'],
  bad:['Lütfen zorunlu alanları (ad, geçerli e-posta, mesaj) doldurun.','Please fill the required fields (name, valid email, message).'],
  err:['Bir hata oluştu. Lütfen tekrar deneyin.','Something went wrong. Please try again.'],
  note:['Bilgileriniz gizli tutulur ve yalnızca sizinle iletişim için kullanılır.','Your information is kept private and used only to contact you.'],
  operational:['Çalışıyor','Operational'], more:['Detaylar','Details'],
  tagline:['Restoranlar için komisyonsuz dijital işletim sistemi.','The commission-free digital operating system for restaurants.']
};
const u = k => t(UI[k]);

const FOOT = [
  [['Platform','Platform'], ['ozellikler','qr-menu','online-siparis','rezervasyon','mutfak-ekrani','masa-yonetimi','fiyatlandirma']],
  [['Çözümler','Solutions'], ['cozumler','paket-servis','coklu-sube','garson-cagirma','yapay-zeka','entegrasyonlar']],
  [['Ürünler','Products'], ['analitik','seo','bildirim-sistemi','tema-sistemi','white-label','karsilastirma']],
  [['Kaynaklar','Resources'], ['dokumantasyon','api','blog','yol-haritasi','surum-notlari','durum']],
  [['Şirket','Company'], ['hakkimizda','neden-hasaca','kariyer','referanslar','basari-hikayeleri','partner-programi','bayilik']],
  [['Destek','Support'], ['destek','yardim','sss','iletisim','demo-talep','teklif-al','satis-ekibi']],
  [['Yasal','Legal'], ['gizlilik','kvkk','cerez-politikasi','kullanim-sartlari','hizmet-sozlesmesi','guvenlik']]
];

const ck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const xs = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const arrow = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ─── block renderers ─── */
const acts = list => (list||[]).map(c =>
  `<a href="${esc(c.href)}" class="btn ${c.primary?'btn-primary':'btn-ghost'} btn-lg">${esc(t(c.label))}</a>`).join('');

function cell(v){
  if (v === 'yes') return `<span class="yes">${ck}</span>`;
  if (v === 'no') return `<span class="no">${xs}</span>`;
  return `<b>${esc(t(v))}</b>`;
}

const R = {
  hero: b => `<section class="wrap"><div class="p-hero rv">
      ${b.tag ? `<span class="eyebrow"><span class="dot"></span>${esc(t(b.tag))}</span>`:''}
      <h1>${esc(t(b.h))}</h1><p>${esc(t(b.p))}</p>
      ${b.cta && b.cta.length ? `<div class="acts">${acts(b.cta)}</div>`:''}
    </div></section>`,

  cards: b => `<section class="block wrap"><div class="rv">
      ${b.h ? `<div class="b-head"><h2>${esc(t(b.h))}</h2>${b.p?`<p>${esc(t(b.p))}</p>`:''}</div>`:''}
      <div class="grid3">${b.items.map(i=>{
        const inner = `<h4>${esc(t(i[0]))}</h4><p>${esc(t(i[1]))}</p>${i[2]?`<span class="more">${u('more')} ${arrow}</span>`:''}`;
        return i[2] ? `<a class="card" href="${esc(i[2])}">${inner}</a>` : `<div class="card">${inner}</div>`;
      }).join('')}</div></div></section>`,

  prose: b => `<section class="block wrap"><div class="prose rv">
      ${b.h?`<div class="b-head"><h2>${esc(t(b.h))}</h2></div>`:''}
      ${b.items.map(i=>`<div class="sec"><h3>${esc(t(i[0]))}</h3><p>${esc(t(i[1]))}</p></div>`).join('')}
    </div></section>`,

  steps: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="steps">${b.items.map((i,n)=>`<div class="step"><div class="num"><span class="shine">${n+1}</span></div>
        <div><h4>${esc(t(i[0]))}</h4><p>${esc(t(i[1]))}</p></div></div>`).join('')}</div></div></section>`,

  faq: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="faq">${b.items.map(i=>`<details class="qa"><summary><span>${esc(t(i[0]))}</span>
        <span class="pl"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span></summary>
        <div class="ans">${esc(t(i[1]))}${i[2]?` <a href="${esc(i[2])}">→</a>`:''}</div></details>`).join('')}</div></div></section>`,

  stats: b => `<section class="block wrap"><div class="stat-grid rv">${b.items.map(i=>
      `<div class="statc"><div class="n">${esc(t(i[0]))}</div><div class="lb">${esc(t(i[1]))}</div></div>`).join('')}</div></section>`,

  table: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="tbl-wrap"><table class="cmp"><thead><tr>${b.cols.map(c=>`<th>${esc(t(c))}</th>`).join('')}</tr></thead>
      <tbody>${b.rows.map(r=>`<tr>${r.map((c,n)=>n===0?`<td>${esc(t(c))}</td>`:`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div></section>`,

  posts: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="posts">${b.items.map(i=>`<article class="post"><div class="meta">${esc(t(i[1]))}</div>
        <h4>${esc(t(i[0]))}</h4><p>${esc(t(i[2]))}</p></article>`).join('')}</div></div></section>`,

  timeline: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="tl">${b.items.map(i=>`<div class="tl-item ${esc(i[3]||'')}"><div class="tl-dot"></div>
        <div><div class="tl-when">${esc(t(i[0]))}</div><h4>${esc(t(i[1]))}</h4><p>${esc(t(i[2]))}</p></div></div>`).join('')}</div></div></section>`,

  status: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="st-list">${b.items.map(i=>`<div class="st-row"><span>${esc(t(i[0]))}</span>
        <span class="st-badge"><span class="d"></span>${u('operational')}</span></div>`).join('')}</div></div></section>`,

  code: b => `<section class="block wrap"><div class="rv">
      <div class="b-head"><h2>${esc(t(b.h))}</h2></div>
      <div class="code-list">${b.items.map(i=>`<div class="code-row"><code>${esc(i[0])}</code><span>${esc(t(i[1]))}</span></div>`).join('')}</div></div></section>`,

  plans: () => {
    const PL = [
      { k:['Başlangıç','Starter'], d:['Dijitale ilk adım için ideal.','Ideal for a first step into digital.'], price:'₺0', per:false, pop:false,
        f:[['QR menü ve dijital menü','QR and digital menu'],['Sınırsız ürün','Unlimited products'],['Tek masa QR','Single-table QR'],['E-posta desteği','Email support']] },
      { k:['Profesyonel','Professional'], d:['Büyüyen restoranlar için en popüler seçim.','The popular choice for growing restaurants.'], price:'₺749', per:true, pop:true,
        f:[['Başlangıç\'taki her şey','Everything in Starter'],['Online ve masa siparişi','Online and table ordering'],['Rezervasyon sistemi','Reservation system'],['Gelişmiş analitik','Advanced analytics'],['Özel alan adı','Custom domain'],['Öncelikli destek','Priority support']] },
      { k:['Kurumsal','Enterprise'], d:['Zincirler ve çok şubeli işletmeler için.','For chains and multi-branch venues.'], price:['Özel','Custom'], per:false, pop:false,
        f:[['Profesyonel\'deki her şey','Everything in Professional'],['AI asistan','AI assistant'],['Çoklu şube yönetimi','Multi-branch management'],['Tam white-label','Full white-label'],['API erişimi','API access'],['SLA ve özel danışman','SLA and dedicated manager']] }
    ];
    return `<section class="block wrap"><div class="price-grid rv">${PL.map(p=>`<div class="plan ${p.pop?'pop':''}">
      ${p.pop?`<span class="badge">${LANG==='en'?'Most Popular':'En Popüler'}</span>`:''}
      <h4>${esc(t(p.k))}</h4><div class="desc">${esc(t(p.d))}</div>
      <div class="amt"><span class="v">${esc(t(p.price))}</span>${p.per?`<span class="per">${LANG==='en'?'/mo':'/ay'}</span>`:''}</div>
      <ul>${p.f.map(f=>`<li>${ck}<span>${esc(t(f))}</span></li>`).join('')}</ul>
      <a href="/demo-talep" class="btn ${p.pop?'btn-primary':'btn-ghost'}">${LANG==='en'?'Start Free':'Ücretsiz Dene'}</a>
    </div>`).join('')}</div></section>`;
  },

  form: b => `<section class="block wrap"><div class="form-wrap rv">
      <div><div class="b-head"><h2>${esc(t(b.h))}</h2><p>${esc(t(b.p))}</p></div></div>
      <form class="form" id="leadForm" data-kind="${esc(b.kind)}" novalidate>
        <div class="form-msg" id="formMsg"></div>
        <div class="row">
          <div class="field"><label>${u('name')}</label><input type="text" name="name" placeholder="${u('namePh')}"></div>
          <div class="field"><label>${u('rest')}</label><input type="text" name="restaurant" placeholder="${u('restPh')}"></div>
        </div>
        <div class="row">
          <div class="field"><label>${u('email')}</label><input type="email" name="email" placeholder="mail@ornek.com"></div>
          <div class="field"><label>${u('phone')}</label><input type="tel" name="phone" placeholder="+90 5xx xxx xx xx"></div>
        </div>
        <div class="field"><label>${u('country')}</label><input type="text" name="country" placeholder="${u('countryPh')}"></div>
        <div class="field"><label>${u('msg')}</label><textarea name="message" rows="4" placeholder="${u('msgPh')}"></textarea></div>
        <button type="submit" class="btn btn-primary btn-lg" id="leadBtn">${u('send')}</button>
        ${b.kind === 'quote' ? `<a class="btn btn-whatsapp btn-lg" href="https://wa.me/38762624751?text=${encodeURIComponent(LANG === 'en' ? 'Hello, I would like to get a price quote for HASACA.' : 'Merhaba, HASACA için fiyat teklifi almak istiyorum.')}" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>${LANG === 'en' ? 'Talk via WhatsApp' : 'WhatsApp Üzerinden Görüş'}</span>
        </a>` : ''}
        <p class="form-note">${u('note')}</p>
      </form>
      </div></section>`,

  cta: b => `<section class="block wrap"><div class="cta-box rv"><h2>${esc(t(b.h))}</h2><p>${esc(t(b.p))}</p>
      <div class="acts">${acts(b.cta)}</div></div></section>`
};

/* ─── render ─── */
function render(){
  document.documentElement.lang = LANG;
  document.getElementById('year').textContent = new Date().getFullYear();
  document.getElementById('rights').textContent = u('rights');
  document.getElementById('navLogin').textContent = u('login');
  document.getElementById('navCta').textContent = u('demo');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-lang')===LANG));

  // nav labels
  const navMap = { ozellikler:['Özellikler','Features'], cozumler:['Çözümler','Solutions'],
    fiyatlandirma:['Fiyatlandırma','Pricing'], dokumantasyon:['Dokümantasyon','Documentation'],
    destek:['Destek','Support'], iletisim:['İletişim','Contact'] };
  document.querySelectorAll('[data-nav]').forEach(a=>{
    const k=a.getAttribute('data-nav');
    if(navMap[k]) a.textContent = t(navMap[k]);
    a.classList.toggle('on', k===SLUG);
  });
  const nlm = document.getElementById('navLoginMobile'); if(nlm) nlm.textContent = u('login');
  const ncm = document.getElementById('navCtaMobile'); if(ncm) ncm.textContent = u('demo');

  // breadcrumb
  document.getElementById('crumb').innerHTML =
    `<a href="/landing">${u('home')}</a><span>›</span><span style="color:var(--text-dim)">${esc(t(P.title))}</span>`;

  // body
  document.getElementById('pageRoot').innerHTML =
    P.blocks.map(b => (R[b.t] ? R[b.t](b) : '')).join('');

  // footer
  document.getElementById('footGrid').innerHTML =
    `<div class="foot-brand"><a href="/landing" class="brand"><span class="mark"><svg class="hasaca-logo-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/></svg></span> HASACA</a>
      <p>${u('tagline')}</p>
      <div class="foot-social">
        <a href="/iletisim" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
        <a href="/iletisim" aria-label="X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h3l-7.5 8.6L22.5 22h-6.9l-4.8-6.3L5.3 22H2.2l8-9.2L1.8 2h7l4.3 5.7L18 2z"/></svg></a>

    `<div class="foot-col"><h5>${esc(t(['Giriş','Sign in']))}</h5>
      <a href="/giris">${esc(t(['Yönetici Girişi','Admin Login']))}</a>

  initReveal(); initForm();

function initReveal(){
  const els = document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.1});
  els.forEach(e=>io.observe(e));
  setTimeout(()=>els.forEach(e=>e.classList.add('in')), 3000);
}

function initForm(){
  const f = document.getElementById('leadForm');
  if(!f) return;
  const PREFIX = { demo:['[Demo Talebi]','[Demo Request]'], quote:['[Teklif Talebi]','[Quote Request]'],
    sales:['[Satış Görüşmesi]','[Sales Call]'], contact:['[İletişim]','[Contact]'] };
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    const msgEl = document.getElementById('formMsg'), btn = document.getElementById('leadBtn');
    const d = Object.fromEntries(new FormData(f).entries());
    f.querySelectorAll('.field').forEach(x=>x.classList.remove('err'));
    const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((d.email||'').trim());
    let bad=false;
    if(!(d.name||'').trim()){ f.querySelector('[name=name]').closest('.field').classList.add('err'); bad=true; }
    if(!okMail){ f.querySelector('[name=email]').closest('.field').classList.add('err'); bad=true; }
    if(!(d.message||'').trim()){ f.querySelector('[name=message]').closest('.field').classList.add('err'); bad=true; }
    if(bad){ msgEl.className='form-msg bad'; msgEl.textContent=u('bad'); return; }
    // tag the lead with which form it came from (single inbox, no schema change)
    d.message = t(PREFIX[f.dataset.kind] || PREFIX.contact) + ' ' + d.message;
    btn.disabled=true; const o=btn.textContent; btn.textContent=u('sending'); msgEl.className='form-msg';
    try{
      const r = await fetch('/api/landing/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
      if(r.ok){ msgEl.className='form-msg ok'; msgEl.textContent=u('ok'); f.reset(); }
      else{ msgEl.className='form-msg bad'; msgEl.textContent=u('bad'); }
    }catch(err){ msgEl.className='form-msg bad'; msgEl.textContent=u('err'); }
    btn.disabled=false; btn.textContent=o;
  });
}

function setLang(l){ LANG=l; try{ localStorage.setItem('hasaca_landing_lang', l); }catch(e){} render(); }

/* Ported from landing.html verbatim — shared localStorage key, so the toggle-button .on state
   stays in sync no matter which of the two files the visitor toggled it from. */
function applyLandingTheme(theme){
  document.documentElement.classList.toggle('theme-mono', theme === 'mono');
  ['themeSwitchBtn', 'themeSwitchBtnFoot'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('on', theme === 'mono');
  });
}
function toggleLandingTheme(){
  const next = document.documentElement.classList.contains('theme-mono') ? 'dark' : 'mono';
  try { localStorage.setItem('landing_theme', next); } catch(e){}
  applyLandingTheme(next);
}

document.addEventListener('DOMContentLoaded', ()=>{
  try{ const s=localStorage.getItem('hasaca_landing_lang'); if(s) LANG=s; }catch(e){}
  let savedTheme = null;
  try { savedTheme = localStorage.getItem('landing_theme'); } catch(e){}
  if (!savedTheme) savedTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'mono' : 'dark';
  applyLandingTheme(savedTheme);
  if(!P){ document.getElementById('pageRoot').innerHTML =
    '<section class="wrap"><div class="p-hero"><h1>404</h1><p>Sayfa bulunamadı.</p><div class="acts"><a href="/landing" class="btn btn-primary btn-lg">Ana Sayfa</a></div></div></section>'; return; }
  render();
  const nav = document.getElementById('nav');
  const onScroll = ()=>nav.classList.toggle('scrolled', window.scrollY>10);
  window.addEventListener('scroll', onScroll, {passive:true}); onScroll();
  document.getElementById('navLinks').addEventListener('click', ()=>nav.classList.remove('open'));
});
</script>
